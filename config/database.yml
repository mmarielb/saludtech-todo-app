default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: saludtech_todo_app_development

test:
  <<: *default
  database: saludtech_todo_app_test

production:
  <<: *default
  database: saludtech_todo_app_bd
  username: <%= ENV['SALUDTECH_TODO_APP_DATABASE_USERNAME'] %>
  password: <%= ENV['SALUDTECH_TODO_APP_DATABASE_PASSWORD'] %>
  host: <%= ENV['SALUDTECH_TODO_APP_DATABASE_HOST'] %>
  port: <%= ENV['SALUDTECH_TODO_APP_DATABASE_PORT'] %>
